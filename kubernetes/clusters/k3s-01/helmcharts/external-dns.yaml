apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: external-dns
  namespace: kube-system
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  repo: https://kubernetes-sigs.github.io/external-dns
  chart: external-dns
  version: 1.16.1
  targetNamespace: external-dns
  createNamespace: true
  valuesContent: |-
    provider:
      name: rfc2136
    extraArgs:
      - --rfc2136-host=10.10.10.2
      - --rfc2136-port=53
      - --rfc2136-zone=plexplease.com
      - --rfc2136-tsig-keyname=externaldns-k3s-01
      - --rfc2136-tsig-secret-alg=hmac-sha256
      - --rfc2136-tsig-secret=$(TSIG_SECRET)
    env:
      - name: TSIG_SECRET
        valueFrom:
          secretKeyRef:
            name: technitium-tsig-secret
            key: tsig-secret
    sources:
      - ingress
    domainFilters:
      - plexplease.com
    policy: sync
    txtOwnerId: k3s-01
    txtPrefix: "edns-"
    interval: 1m
    logLevel: info
    serviceAccount:
      create: true
      name: external-dns
