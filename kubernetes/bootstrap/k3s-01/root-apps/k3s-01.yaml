apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: k3s-01
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/echoares-lab/homelab-gitops.git
    targetRevision: production
    path: kubernetes/clusters/k3s-01
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
