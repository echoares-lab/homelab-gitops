apiVersion: apps/v1
kind: Deployment
metadata:
  name: apprise-alertmanager-webhook
  namespace: notifications
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: apprise-alertmanager-webhook
  template:
    metadata:
      labels:
        app.kubernetes.io/name: apprise-alertmanager-webhook
    spec:
      containers:
        - name: webhook
          image: python:3.13.5-alpine3.22
          imagePullPolicy: IfNotPresent
          command:
            - python
            - /app/server.py
          env:
            - name: APPRISE_URL
              value: http://apprise.notifications.svc.cluster.local:8000/notify
            - name: APPRISE_KEY
              value: apprise
            - name: LISTEN_PORT
              value: "3000"
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 60
          volumeMounts:
            - name: webhook-script
              mountPath: /app
              readOnly: true
      volumes:
        - name: webhook-script
          configMap:
            name: apprise-alertmanager-webhook
