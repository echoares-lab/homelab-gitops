apiVersion: v1
kind: ConfigMap
metadata:
  name: apprise-alertmanager-webhook
  namespace: notifications
  annotations:
    argocd.argoproj.io/sync-wave: "5"
data:
  server.py: |
    import json
    import os
    import urllib.parse
    import urllib.request
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    APPRISE_URL = os.environ["APPRISE_URL"].rstrip("/")
    APPRISE_KEY = os.environ.get("APPRISE_KEY", "apprise")
    LISTEN_PORT = int(os.environ.get("LISTEN_PORT", "3000"))

    def alert_line(alert):
        labels = alert.get("labels", {})
        annotations = alert.get("annotations", {})
        name = labels.get("alertname", "alert")
        namespace = labels.get("namespace")
        severity = labels.get("severity")
        summary = annotations.get("summary") or annotations.get("description") or ""
        parts = [name]
        if namespace:
            parts.append(f"namespace={namespace}")
        if severity:
            parts.append(f"severity={severity}")
        if summary:
            parts.append(summary)
        return " - ".join(parts)

    def build_notification(payload):
        status = payload.get("status", "unknown")
        alerts = payload.get("alerts", [])
        firing = sum(1 for alert in alerts if alert.get("status") == "firing")
        resolved = sum(1 for alert in alerts if alert.get("status") == "resolved")
        title = f"Alertmanager {status}: {firing} firing, {resolved} resolved"
        body_lines = [alert_line(alert) for alert in alerts]
        body = "\n".join(body_lines) if body_lines else json.dumps(payload, sort_keys=True)
        notify_type = "failure" if firing else "success"
        return title, body, notify_type

    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path == "/healthz":
                self.send_response(200)
                self.end_headers()
                self.wfile.write(b"ok\n")
                return
            self.send_response(404)
            self.end_headers()

        def do_POST(self):
            length = int(self.headers.get("Content-Length", "0"))
            try:
                payload = json.loads(self.rfile.read(length) or b"{}")
                title, body, notify_type = build_notification(payload)
                data = urllib.parse.urlencode(
                    {
                        "title": title,
                        "body": body,
                        "type": notify_type,
                        "tag": "alerts",
                    }
                ).encode()
                request = urllib.request.Request(
                    f"{APPRISE_URL}/{APPRISE_KEY}",
                    data=data,
                    method="POST",
                    headers={"Content-Type": "application/x-www-form-urlencoded"},
                )
                with urllib.request.urlopen(request, timeout=10) as response:
                    status = response.status
                self.send_response(200 if status < 400 else 502)
                self.end_headers()
                self.wfile.write(f"apprise_status={status}\n".encode())
            except Exception as exc:
                self.send_response(500)
                self.end_headers()
                self.wfile.write(f"error={exc}\n".encode())

        def log_message(self, fmt, *args):
            print(fmt % args)

    ThreadingHTTPServer(("", LISTEN_PORT), Handler).serve_forever()
