# FAST TIER — low-latency workloads: databases, message queues, stateful apps
# Backend: k3s-data ZFS pool (Samsung 980 PRO 2TB + Optane HE118B ZIL, local NVMe, no network hop)
# Phase 1 comparable: nvme-local p99=959µs; iSCSI db_p99=220µs (TrueNAS, network)
# Local ZFS expected to beat iSCSI on db_p99 once benchmarked (no iSCSI round-trip + Optane ZIL)
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: storage-fast
  annotations:
    storageclass.kubernetes.io/is-default-class: "false"
provisioner: org.democratic-csi.local-zfs
parameters:
  csi.storage.k8s.io/fstype: zfs
reclaimPolicy: Retain
volumeBindingMode: Immediate
allowVolumeExpansion: true
