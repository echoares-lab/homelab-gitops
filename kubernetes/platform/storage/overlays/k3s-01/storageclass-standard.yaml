# STANDARD TIER — platform services: monitoring, logging, ArgoCD state
# Backend: TrueNAS K3S_HDD iSCSI (phase1: db_p99=220µs, r=64464 iops)
# Requires: democratic-csi-truenas-iscsi-config Secret (populated by OpenBao ExternalSecret)
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: storage-standard
provisioner: org.democratic-csi.iscsi
parameters:
  csi.storage.k8s.io/fstype: ext4
reclaimPolicy: Retain
volumeBindingMode: Immediate
allowVolumeExpansion: true
