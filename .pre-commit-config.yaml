repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: check-yaml
        args: [--unsafe]

  - repo: local
    hooks:
      - id: validate-ci-config
        name: Validate CI Configuration
        entry: python3 scripts/validate_ci_config.py
        language: system
        stages: [commit]
        pass_filenames: false
        files: '\.github/workflows/.*\.yml|pytest\.ini|requirements.*\.txt|pyproject\.toml'

      - id: validate-test-references
        name: Validate Test File References
        entry: bash -c 'test -d tests/test_services && test -f tests/test_manage_cli.py'
        language: system
        stages: [commit]
        pass_filenames: false
        files: '\.github/workflows/.*\.yml'

  # ── Master-Policy gates (added 2026-08-12) ─────────────────────────────
  # The AGENTS.md drift check lives here rather than in CI because it needs the
  # Obsidian vault, which GitHub-hosted runners cannot reach.
  - repo: local
    hooks:
      - id: doc-minimalism
        name: Master-Policy 1.6 documentation minimalism
        entry: python3 /home/dev/repos/dev-policies/tooling/scripts/check-doc-minimalism.py
        language: system
        pass_filenames: false
        always_run: true

      - id: agents-md-drift
        name: AGENTS.md matches the vault
        entry: bash -c 'python3 /home/dev/repos/dev-policies/tooling/scripts/render-agents-md.py --all --check'
        language: system
        pass_filenames: false
        always_run: true
