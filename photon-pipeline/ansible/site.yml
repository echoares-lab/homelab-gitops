---
- name: Configure Photon OS Golden Image Deployed VM
  hosts: all
  become: true
  gather_facts: true

  roles:
    - docker

  tasks:
    - name: Ensure all packages are up to date
      ansible.builtin.command: tdnf update -y
      register: tdnf_update
      changed_when: "'Nothing to do' not in tdnf_update.stdout"

    - name: Install useful utilities
      ansible.builtin.command: tdnf install -y htop tar rsync curl
      register: tdnf_install
      changed_when: "'Nothing to do' not in tdnf_install.stdout"

    - name: Ensure SSH hardening
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
        state: present
      loop:
        - { regexp: '^PermitRootLogin', line: 'PermitRootLogin no' }
        - { regexp: '^PasswordAuthentication', line: 'PasswordAuthentication no' }
      notify: Restart sshd

    - name: Enable and start firewalld (Photon default)
      ansible.builtin.systemd:
        name: iptables
        enabled: true
        state: started

  handlers:
    - name: Restart sshd
      ansible.builtin.systemd:
        name: sshd
        state: restarted
