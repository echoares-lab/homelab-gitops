# Photon OS Deployment Configuration
# This file contains all settings for building and deploying.

vcenter:
  datacenter: "HOMELAB"
  cluster: "Primary"
  host: "esxi-01.mgmt.plexplease.com"
  datastore: "NVME_2TB_970_SAMSUNG_EVO_M.2"
  network: "VM Network"

content_library:
  name: "PHOTON"
  template: "photon-5.0-golden" # Final versioned golden image

vm_specs:
  cpu: 4
  ram_gb: 8
  guest_id: "vmwarePhoton64Guest"
  disk:
    label: "disk0"
    size_gb: 50
    thin_provisioned: true

deployment:
  ip_policy: "dhcpPolicy"
  mac_address: "00:50:56:af:00:01" # Test MAC address
  tags:
    - "photon"
    - "docker"
  # Name schema: <role>-<instance>.<env>.<domain>
  vm_name_prefix: "docker"
  vm_instance: "02"
  vm_name_domain: "infa.plexplease.com"
