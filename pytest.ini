[pytest]
# Project configuration
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Coverage configuration (removed addopts to avoid conflicts with CI workflow)
# Coverage is configured in the CI workflow only to allow flexible reporting per environment

# Markers for test classification
markers =
    unit: Unit tests (no infrastructure)
    integration: Integration tests (requires test VM)
    e2e: Full end-to-end tests (requires golden image build)

# Testinfra-specific configuration
[testinfra]
hosts = localhost
