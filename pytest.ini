[pytest]
# Project configuration
# testpaths is the Tier 2 (unit) suite: bare `pytest` runs exactly the tier the
# gates below are calibrated for. The top-level tests/*.py files are testinfra
# tests that need a real `host` fixture, and tests/integration + tests/e2e are
# Tiers 3-4; those tiers are invoked with explicit paths, which override this.
testpaths = tests/unit tests/cli
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Testing-Policy gates, armed by default so a bare `pytest` fails locally for
# exactly the reasons CI fails.
#   --cov-fail-under      Testing-Policy §2 Tier 2 floor is 80% statement
#                         coverage; this repo holds a stricter 85% bar it
#                         already meets (86.7% at time of writing). Never lower
#                         it to make a run green -- write tests.
#   --max-suite-seconds   Testing-Policy §3.1 Tier 2 cap: the entire unit suite,
#                         whole repo, must finish in 10s. Implemented by the
#                         repo-root conftest.py plugin. Tiers 3/4 pass their own
#                         cap (45s / 60s) on the command line.
addopts =
    --cov=src/homelab_gitops
    --cov-report=term-missing
    --cov-fail-under=85
    --max-suite-seconds=10

# Markers for test classification
markers =
    unit: Unit tests (no infrastructure)
    integration: Integration tests (requires test VM)
    e2e: Full end-to-end tests (requires golden image build)

# Testinfra-specific configuration
[testinfra]
hosts = localhost
