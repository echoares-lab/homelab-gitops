[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "homelab-gitops"
version = "0.1.0"
description = "Homelab GitOps infrastructure automation"
requires-python = ">=3.10"
dependencies = [
    "typer",
    "rich",
    "pyyaml",
    "typing_extensions",
    "requests",
    "pydantic>=2.0.0",
    "pyvmomi",
    "pytest-testinfra",
    "pexpect",
    "paramiko",
    "acme",
    "cryptography",
    # Bounded to 2.x: the SDK renamed FastMCP -> MCPServer in 2.0 and moved the
    # import path. An unbounded spec is what let 2.0 silently break CI; keep the
    # major version explicit so the next major bump is a deliberate change.
    "mcp[cli]>=2,<3"
]

[project.scripts]
homelab-gitops = "homelab_gitops.cli:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["homelab_gitops*"]
