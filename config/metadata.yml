  docker: "Install and configure Docker Engine and Docker Compose."
  dns: "Configure Technitium DNS services."
  fcos: "Fedora CoreOS immutable host configuration using Ignition."
  alloy: "Install Grafana Alloy monitoring agents on tagged hosts."
  benchmark: "Mark hosts used for storage or infrastructure benchmark runs."
  storage_benchmark: "Run the two-phase storage benchmark suite (Phase 1 VM + Phase 2 k3s pods)."
  cf_dev: "Provision a Cloudflare Access automation development workstation."
  cf_runner: "Provision a self-hosted GitHub Actions runner for Cloudflare Access automation."
  combined_dev: "Provision a combined homelab and Cloudflare development workstation."
  engenius_epc: "Deploy the EnGenius Private Cloud network appliance stack."
  git_test: "Provision a self-hosted GitHub Actions runner for repository test workloads."
  homelab_dev: "Provision a homelab-gitops development workstation."
  k3s_server: "Bootstrap a single-node k3s control plane for GitOps-managed workloads."
  mcp_gateway: "Deploy the MCP Gateway container stack."
  k3s_deadman: "Run the independent k3s Watchdog heartbeat receiver and SES fallback."

