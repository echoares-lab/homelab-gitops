vcenter:
  datacenter: HOMELAB
  cluster: Primary
  host: 10.10.10.11
  datastore: NVME_2TB_970_SAMSUNG_EVO_M.2
  network: VM Network
content_library:
  name: GOLDEN
  template: photon-test-base
vm_specs:
  cpu: 16
  memory: 24576
  disk: 50
deployment:
  tags:
  - photon
  - docker
  - alloy
  - mcp_gateway
  vm_name_prefix: mcp
  vm_name_domain: infa.plexplease.com
  ansible_user: ansible
  ansible_password: Singer4life!@
  ansible_become_password: Singer4life!@
  mcp_gateway_profiles:
  - name: github
    port: 8081
    transport: streaming
    servers:
    - name: github
      title: GitHub MCP Server
      image: ghcr.io/github/github-mcp-server:latest
      description: GitHub repository and issue management tools.
      allow_hosts:
      - api.github.com:443
      - github.com:443
      - raw.githubusercontent.com:443
      secrets:
      - name: github.personal_access_token
        env: GITHUB_PERSONAL_ACCESS_TOKEN
        example: <token>
        description: GitHub token used by the MCP server.
