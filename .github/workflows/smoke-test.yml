# .github/workflows/smoke-test.yml
# Purpose: Smoke test — validates unit tests pass and 1Password secrets resolve.

name: Smoke Test

on:
  push:
    branches:
      - production
      - main
      - master
  pull_request:
  workflow_dispatch:
    inputs:
      runner:
        description: >-
          Runner to use. Defaults to the self-hosted arc runner (routes
          through Nexus, has warm caches). Pick ubuntu-latest only as a
          manual override if the cluster/arc runner is known to be down.
        type: choice
        options:
          - arc
          - ubuntu-latest
        default: arc

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  id-token: write

jobs:
  smoke:
    name: Unit tests + secrets validation
    runs-on: ${{ github.event.inputs.runner || 'arc' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: |
          uv venv .venv --python 3.12
          echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH
          uv pip install -e .
          uv pip install -r requirements.txt

      - name: Run unit tests (no secrets needed)
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src
        run: pytest tests/unit/ tests/cli/ -v

      - name: Install 1Password CLI
        uses: 1password/install-cli-action@v1

      - name: Validate 1Password secrets resolve
        if: ${{ env.OP_SERVICE_ACCOUNT_TOKEN != '' }}
        continue-on-error: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: |
          echo "Validating all op:// references in config/secrets.env resolve..."
          op run --env-file=config/secrets.env -- bash -c '
            echo "VCENTER_SERVER=${VCENTER_SERVER:0:8}... (masked)"
            echo "SSH_ADMIN_USERNAME=${SSH_ADMIN_USERNAME}"
            echo "All required secrets resolved successfully."
          ' || echo "Vault not found, skipping validation."

      - name: Show runner info
        run: |
          echo "Runner: $(hostname) | User: $(whoami) | Python: $(python3 --version)"
          echo "Git: $(git --version)"
