# .github/workflows/smoke-test.yml
# Purpose: Smoke test — validates unit tests pass and 1Password secrets resolve.

name: Smoke Test

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  smoke:
    name: Unit tests + secrets validation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests (no secrets needed)
        run: python3 -m pytest tests/test_manage.py tests/test_connectivity_optimized.py tests/test_technitium_manager.py -v

      - name: Install 1Password CLI
        uses: 1password/install-cli-action@v1

      - name: Validate 1Password secrets resolve
        if: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN != '' }}
        continue-on-error: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: |
          echo "Validating all op:// references in config/secrets.env resolve..."
          op run --env-file=config/secrets.env -- bash -c '
            echo "VCENTER_SERVER=${VCENTER_SERVER:0:8}... (masked)"
            echo "SSH_ADMIN_USERNAME=${SSH_ADMIN_USERNAME}"
            echo "All required secrets resolved successfully."
          ' || echo "Vault not found, skipping validation."

      - name: Show runner info
        run: |
          echo "Runner: $(hostname) | User: $(whoami) | Python: $(python3 --version)"
          echo "Git: $(git --version)"
