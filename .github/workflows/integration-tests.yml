# .github/workflows/integration-tests.yml
# Purpose: Tier 3 integration suite (tests/integration/, mocked drivers) on
# every push/PR, plus the VM-backed connectivity and Ansible dry-run steps when
# a test VM is configured.
#
# History: from 2026-06-08 to 2026-09-11 every run of this workflow was a
# zero-job `failure` (100/100 runs). GitHub refused the file at parse time
# because `secrets.*` is not an allowed context in a step-level `if:` -- the run
# was named after the file path instead of `name:`, the tell-tale of a parse
# failure. The secret is mapped into job-level `env` below and the steps test
# `env.TEST_VM_HOST` instead, which is the supported pattern. The job also
# targeted `[self-hosted, testing]`; no runner with that label is registered on
# this repository, and CICD-Policy §1.2 routes ordinary jobs to the ARC scale
# set (`runs-on: arc`), which lives inside the homelab network.

name: Integration Tests

on:
  push:
    branches:
      - production
      - main
      - master
      - develop
  pull_request:
  workflow_dispatch:
    inputs:
      runner:
        description: >-
          Runner to use. Defaults to the self-hosted arc runner (routes
          through Nexus, has warm caches). Pick ubuntu-latest only as a
          manual override if the cluster/arc runner is known to be down.
        type: choice
        options:
          - arc
          - ubuntu-latest
        default: arc

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed paths
    runs-on: ${{ github.event.inputs.runner || 'arc' }}
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Filter changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          # 'every' is required for the '!' rules below to exclude; with the
          # default 'some' predicate the negations are ignored.
          predicate-quantifier: 'every'
          # INVARIANT (Agent-First-Refactor E6.T3): this filter gates only the
          # job(s) below that read its output. Secret scanning and the
          # Master-Policy drift gates (policy-check.yml: gitleaks,
          # doc-minimalism ratchet, AGENTS.md provenance) and sbom.yml have NO
          # path filter and must never be placed behind one. A docs-only change
          # skips this lane and still runs them.
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!**/*.md'
              - '!LICENSE'

  integration-tests:
    name: Integration Tests (Tier 3)
    needs: [changes]
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/production' || needs.changes.outputs.code == 'true'
    runs-on: ${{ github.event.inputs.runner || 'arc' }}
    env:
      # `secrets` cannot be read from a step `if:`; `env` can. An unset secret
      # expands to the empty string, which is what the conditions below test.
      TEST_VM_HOST: ${{ secrets.TEST_VM_HOST }}
      TEST_VM_SSH_KEY: ${{ secrets.TEST_VM_SSH_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: |
          uv venv .venv --python 3.12
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
          uv pip install -e .
          uv pip install -r requirements.txt

      # tests/integration/ is fully mocked (see its module docstrings) and runs
      # without a VM; tests that genuinely need one carry @pytest.mark.integration
      # and are skipped by tests/conftest.py when TEST_VM_HOST is unset.
      - name: Run integration tests (Tier 3)
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src
        run: |
          echo "=== Tier 3 Integration Suite (~45s duration target, telemetry) ==="
          pytest tests/integration/ -v \
            --tb=short -m "not e2e" \
            --no-cov --suite-seconds-target=45

      - name: Skip VM-backed steps (TEST_VM_HOST not configured)
        if: env.TEST_VM_HOST == ''
        run: |
          echo "TEST_VM_HOST is not configured; the VM connectivity check and the"
          echo "Ansible dry-run are skipped. To enable them add repository secrets:"
          echo "  - TEST_VM_HOST     (SSH-reachable test VM)"
          echo "  - TEST_VM_SSH_KEY  (path to the private key on the runner)"

      - name: Validate test VM is accessible
        if: env.TEST_VM_HOST != ''
        run: |
          echo "Testing connectivity to $TEST_VM_HOST..."
          timeout 10 bash -c "cat < /dev/null > /dev/tcp/$TEST_VM_HOST/22" || {
            echo "ERROR: Cannot reach test VM at $TEST_VM_HOST:22"
            exit 1
          }
          echo "Test VM is accessible"

      - name: Run Ansible syntax check and dry-run
        if: env.TEST_VM_HOST != ''
        run: |
          echo "=== Ansible Dry-Run ==="
          ansible-playbook -i "$TEST_VM_HOST," \
            -u ubuntu \
            --private-key "$TEST_VM_SSH_KEY" \
            -e "ansible_python_interpreter=/usr/bin/python3" \
            --check \
            ansible/site.yml

  summary:
    name: Integration Tests summary
    needs: [changes, integration-tests]
    if: always()
    runs-on: ${{ github.event.inputs.runner || 'arc' }}
    steps:
      - name: Aggregate status check
        run: |
          echo "=== Upstream Job Results ==="
          echo "changes: ${{ needs.changes.result }}"
          echo "integration-tests: ${{ needs.integration-tests.result }}"

          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "::error::Job 'changes' failed with status: ${{ needs.changes.result }}"
            exit 1
          fi

          # CICD-Policy 1.2.1: a cancelled run says nothing about the code, so
          # it must not pass. CICD-Policy 1.3: a skipped path-scoped job counts
          # as passed.
          if [ "${{ needs.integration-tests.result }}" != "success" ] && [ "${{ needs.integration-tests.result }}" != "skipped" ]; then
            echo "::error::Job 'integration-tests' failed with status: ${{ needs.integration-tests.result }}"
            exit 1
          fi

          echo "All required upstream jobs passed or were legitimately skipped"
