name: Lint & Unit Tests

on:
  push:
    branches:
      - production
      - main
      - master
      - develop
  pull_request:
  workflow_dispatch:
    inputs:
      runner:
        description: >-
          Runner to use. Defaults to the self-hosted arc runner (routes
          through Nexus, has warm caches). Pick ubuntu-latest only as a
          manual override if the cluster/arc runner is known to be down.
        type: choice
        options:
          - arc
          - ubuntu-latest
        default: arc

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pull-requests: write

jobs:
  lint-and-test:
    name: Lint & Unit Tests
    runs-on: ${{ github.event.inputs.runner || 'arc' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: |
          uv venv .venv --python 3.12
          echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH
          uv pip install -e .
          uv pip install -r requirements.txt

      - name: Run YAML linting
        run: |
          echo "=== YAML Linting ==="
          yamllint config/profiles/*.yml || true
          [ -f ansible/site.yml ] && yamllint ansible/site.yml || true

      - name: Run Ansible linting
        run: |
          echo "=== Ansible Linting ==="
          [ -d ansible ] && ansible-lint ansible/ || true

      - name: Run Python linting (Ruff & PEP 8)
        run: |
          echo "=== Python Linting (Ruff & flake8) ==="
          ruff check manage.py scripts/ src/ tests/ --select=E9,F63,F7,F82
          flake8 manage.py scripts/ src/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 manage.py scripts/ src/ tests/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run shell linting
        run: |
          echo "=== Shell Linting ==="
          shellcheck scripts/*.sh || true

      # Tier 2 gate. Both thresholds live in pytest.ini addopts so this step
      # cannot drift from what a developer gets by typing `pytest` locally:
      #   --cov-fail-under=85     (Testing-Policy §2, floor 80%)
      #   --max-suite-seconds=10  (Testing-Policy §3.1 Tier 2 cap)
      # No `|| true`, no `continue-on-error`: breaching either fails the build.
      - name: Run unit tests with coverage and duration gates
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src
        run: |
          echo "=== Tier 2 Unit Suite (coverage >=85%, duration <=10s) ==="
          pytest --cov-report=json --cov-report=html:htmlcov

      - name: Build package artifacts
        run: |
          echo "=== Build Package Artifacts ==="
          uv build --sdist --wheel
          ls -la dist/

      - name: Smoke test installed package
        run: |
          echo "=== Clean Install Smoke Test ==="
          uv venv /tmp/homelab-gitops-clean-install --python 3.12
          uv pip install --python /tmp/homelab-gitops-clean-install/bin/python dist/*.whl
          /tmp/homelab-gitops-clean-install/bin/homelab-gitops --help
          /tmp/homelab-gitops-clean-install/bin/homelab-gitops doctor --help

      - name: Upload coverage to artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/
          retention-days: 7

      - name: Print test summary
        if: always()
        run: |
          echo "=== Workflow Summary ==="
          echo "✓ YAML linting: Completed"
          echo "✓ Ansible linting: Completed"
          echo "✓ Python linting (Ruff & PEP 8): Completed"
          echo "✓ Shell linting: Completed"
          echo "✓ Unit tests: Completed"
          echo "✓ Coverage check: 85% minimum enforced"
          echo "✓ Package build and clean install smoke test: Completed"
