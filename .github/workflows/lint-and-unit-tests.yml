name: Lint & Unit Tests

on:
  push:
    branches:
      - production
      - main
      - master
      - develop
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  lint-and-test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r requirements.txt

      - name: Run YAML linting
        run: |
          echo "=== YAML Linting ==="
          yamllint config/profiles/*.yml || true
          yamllint ansible/site.yml || true

      - name: Run Ansible linting
        run: |
          echo "=== Ansible Linting ==="
          ansible-lint ansible/ || true

      - name: Run Python linting (PEP 8)
        run: |
          echo "=== Python Linting (flake8) ==="
          flake8 manage.py scripts/ src/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 manage.py scripts/ src/ tests/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run shell linting
        run: |
          echo "=== Shell Linting ==="
          shellcheck scripts/*.sh || true

      # Tier 2 gate. Both thresholds live in pytest.ini addopts so this step
      # cannot drift from what a developer gets by typing `pytest` locally:
      #   --cov-fail-under=85     (Testing-Policy §2, floor 80%)
      #   --max-suite-seconds=10  (Testing-Policy §3.1 Tier 2 cap)
      # No `|| true`, no `continue-on-error`: breaching either fails the build.
      - name: Run unit tests with coverage and duration gates
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src
        run: |
          echo "=== Tier 2 Unit Suite (coverage >=85%, duration <=10s) ==="
          pytest --cov-report=json --cov-report=html:htmlcov

      - name: Build package artifacts
        run: |
          echo "=== Build Package Artifacts ==="
          python -m build --sdist --wheel
          ls -la dist/

      - name: Smoke test installed package
        run: |
          echo "=== Clean Install Smoke Test ==="
          python -m venv /tmp/homelab-gitops-clean-install
          /tmp/homelab-gitops-clean-install/bin/python -m pip install --upgrade pip
          /tmp/homelab-gitops-clean-install/bin/pip install dist/*.whl
          /tmp/homelab-gitops-clean-install/bin/homelab-gitops --help
          /tmp/homelab-gitops-clean-install/bin/homelab-gitops doctor --help

      - name: Upload coverage to artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/
          retention-days: 7

      - name: Print test summary
        if: always()
        run: |
          echo "=== Workflow Summary ==="
          echo "✓ YAML linting: Completed"
          echo "✓ Ansible linting: Completed"
          echo "✓ Python linting (PEP 8): Completed"
          echo "✓ Shell linting: Completed"
          echo "✓ Unit tests: Completed"
          echo "✓ Coverage check: 85% minimum enforced"
          echo "✓ Package build and clean install smoke test: Completed"
