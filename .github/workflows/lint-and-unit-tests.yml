name: Lint & Unit Tests

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  lint-and-test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install yamllint ansible-lint flake8 pytest-cov

      - name: Run YAML linting
        run: |
          echo "=== YAML Linting ==="
          yamllint config/profiles/*.yml || true
          yamllint ansible/site.yml || true

      - name: Run Ansible linting
        run: |
          echo "=== Ansible Linting ==="
          ansible-lint ansible/ || true

      - name: Run Python linting (PEP 8)
        run: |
          echo "=== Python Linting (flake8) ==="
          flake8 manage.py scripts/ src/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 manage.py scripts/ src/ tests/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run shell linting
        run: |
          echo "=== Shell Linting ==="
          shellcheck scripts/*.sh || true

      - name: Run unit tests with coverage
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src
        run: |
          echo "=== Unit Tests with Coverage ==="
          pytest tests/ -v \
            --cov=homelab_gitops \
            --cov=manage.py \
            --cov-report=term-missing \
            --cov-report=json \
            --cov-report=html:htmlcov

      - name: Check coverage threshold (50%)
        run: |
          echo "=== Coverage Check ==="
          python -m coverage report --fail-under=50 --precision=2 || (echo "Coverage below 50% threshold!" && exit 1)

      - name: Upload coverage to artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/
          retention-days: 7

      - name: Print test summary
        if: always()
        run: |
          echo "=== Workflow Summary ==="
          echo "✓ YAML linting: Completed"
          echo "✓ Ansible linting: Completed"
          echo "✓ Python linting (PEP 8): Completed"
          echo "✓ Shell linting: Completed"
          echo "✓ Unit tests: Completed"
          echo "✓ Coverage check: 50% minimum enforced"
