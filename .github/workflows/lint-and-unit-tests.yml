name: Lint & Unit Tests

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  lint-and-test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install yamllint ansible-lint flake8

      - name: Run YAML linting
        run: |
          echo "=== YAML Linting ==="
          yamllint config/profiles/*.yml config/metadata.yml || true
          yamllint ansible/site.yml || true

      - name: Run Ansible linting
        run: |
          echo "=== Ansible Linting ==="
          ansible-lint ansible/ || true

      - name: Run Python linting (PEP 8)
        run: |
          echo "=== Python Linting (flake8) ==="
          flake8 manage.py scripts/ src/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 manage.py scripts/ src/ tests/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run shell linting
        run: |
          echo "=== Shell Linting ==="
          shellcheck scripts/*.sh || true

      - name: Validate CI configuration
        run: |
          echo "=== CI Configuration Validation ==="
          python3 scripts/validate_ci_config.py || (echo "❌ CI config errors found" && exit 1)

      - name: Run unit tests with coverage
        run: |
          echo "=== Unit Tests with Coverage ==="
          pytest tests/unit/ -v \
            --cov=services \
            --cov=src/opnsense \
            --cov=manage.py \
            --cov-report=term-missing \
            --cov-report=json \
            --cov-report=html:htmlcov

      - name: Check coverage threshold (85%)
        run: |
          echo "=== Coverage Check ==="
          python -m coverage report --fail-under=85 --precision=2 || (echo "Coverage below 85% threshold!" && exit 1)

      - name: Upload coverage to artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/
          retention-days: 7

      - name: Comment PR with coverage results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            try {
              const coverage = fs.readFileSync('.coverage.json', 'utf8');
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `## Coverage Report\n\`\`\`\n${coverage}\n\`\`\``
              });
            } catch(e) {
              console.log('Coverage report not available');
            }
        continue-on-error: true

      - name: Print test summary
        if: always()
        run: |
          echo "=== Workflow Summary ==="
          echo "✓ YAML linting: Completed"
          echo "✓ Ansible linting: Completed"
          echo "✓ Python linting (PEP 8): Completed"
          echo "✓ Shell linting: Completed"
          echo "✓ Unit tests: Completed"
          echo "✓ Coverage check: 85% minimum enforced"
