name: Full End-to-End Tests

on:
  workflow_dispatch:
  release:
    types: [created, published]

permissions:
  contents: read

jobs:
  e2e-tests:
    name: E2E Pipeline (Tier 3)
    runs-on: [self-hosted, testing]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest-testinfra

      - name: Run E2E tests
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src
        run: |
          echo "=== Full E2E Tests ==="
          pytest tests/e2e/ -v
