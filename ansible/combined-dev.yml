---
# Provisions a combined dev workstation for both homelab-gitops and cloudflare_access_automation.
# Creates a 'developer' user, authenticates gh CLI, and clones both repos.
#
# Required variables (pass via -e or vault):
#   github_pat  - GitHub PAT with scopes: repo, read:org
#                 Generate at: github.com/settings/tokens
#
# Optional overrides:
#   dev_user    - local username (default: developer)
#   dev_repos   - list of repo names to clone (default: both repos)
#
# Example:
#   ansible-playbook ansible/combined-dev.yml \
#     -i ansible/inventory/vmware_vms.yml \
#     -l tag_combined_dev \
#     -e github_pat=<token>

- name: Provision combined dev workstation
  hosts: tag_combined_dev
  become: true
  gather_facts: true
  roles:
    - base
    - security
    - dev_combined
