---
# Provisions a developer workstation for the cloudflare_access_automation project.
#
# Example:
#   ansible-playbook ansible/cloudflare-dev.yml \
#     -i ansible/inventory/vmware_vms.yml \
#     -l tag_cf_dev

- name: Provision Cloudflare Access dev workstation baseline
  hosts: tag_cf_dev
  become: true
  gather_facts: true
  roles:
    - base
    - security
    - github_runner_base

- name: Install Cloudflare Access dev toolchain
  hosts: tag_cf_dev
  become: true
  gather_facts: false
  roles:
    - dev_cloudflare
