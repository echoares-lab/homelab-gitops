---
# Provisions an org-level self-hosted GitHub Actions runner for the echoares-lab org.
# The runner is available to ALL repos in the org (policy controlled via runner group).
#
# Required variables (pass via -e or vault):
#   runner_token  - org registration token
#                   Generate at: github.com/organizations/echoares-lab/settings/actions/runners/new
#                   Token expires 1 hour after generation.
#
# Optional:
#   runner_name          - defaults to inventory_hostname
#   runner_extra_labels  - extra comma-separated labels beyond "self-hosted,Linux,X64"
#   runner_actions_group - GitHub Actions runner group (default: "Default")
#
# Example:
#   ansible-playbook ansible/cloudflare-runner.yml \
#     -i ansible/inventory/vmware_vms.yml \
#     -l tag_cf_runner \
#     -e runner_token=<token>

- name: Provision Cloudflare Access runner baseline
  hosts: tag_cf_runner
  become: true
  gather_facts: true
  roles:
    - base
    - security
    - log_retention
    - github_runner_base

- name: Install and register GitHub Actions runner
  hosts: tag_cf_runner
  become: true
  gather_facts: false
  roles:
    - github_runner
    - github_runner_ci
