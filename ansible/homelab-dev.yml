---
# Provisions a developer workstation for homelab-gitops.
# Installs the same toolchain as scripts/setup.sh (OpenTofu, Packer, govc, Ansible, Python deps).
#
# Example:
#   ansible-playbook ansible/homelab-dev.yml \
#     -i ansible/inventory/vmware_vms.yml \
#     -l tag_homelab_dev

- name: Provision homelab-gitops dev workstation baseline
  hosts: tag_homelab_dev
  become: true
  gather_facts: true
  roles:
    - base
    - security

- name: Install homelab-gitops dev toolchain
  hosts: tag_homelab_dev
  become: true
  gather_facts: false
  roles:
    - dev_homelab
