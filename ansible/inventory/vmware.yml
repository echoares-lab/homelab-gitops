# Ansible Dynamic Inventory for vSphere
plugin: community.vmware.vmware_vm_inventory
strict: false
validate_certs: false
with_tags: true

# Group hosts by tags found in vCenter
# In this environment, tags are returned as a simple list of strings
keyed_groups:
  - key: tags
    prefix: tag
    separator: "_"

hostnames:
  - guest.ipAddress
  - config.name

# Set default connection variables
compose:
  ansible_user: "'ansible'"

# Only include VMs that have at least one of our tags
filters:
  - "'photon' in tags or 'ubuntu' in tags or 'docker' in tags"
