---
- name: Validate required dead-man credentials
  ansible.builtin.assert:
    that:
      - lookup('env', item) | length > 0
    fail_msg: "Required secret environment variable {{ item }} is missing"
  loop:
    - K3S_DEADMAN_CA_CERT
    - K3S_DEADMAN_SERVER_CERT
    - K3S_DEADMAN_SERVER_KEY
    - SES_SMTP_USERNAME
    - SES_SMTP_PASSWORD
  no_log: true

- name: Create dead-man service group
  ansible.builtin.group:
    name: k3s-deadman
    system: true

- name: Create dead-man service account
  ansible.builtin.user:
    name: k3s-deadman
    group: k3s-deadman
    system: true
    shell: /sbin/nologin
    home: /var/lib/k3s-deadman

- name: Disable inherited application services
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: false
    state: stopped
  loop:
    - docker.service
    - docker.socket
    - mcp-gateway.service
  failed_when: false

- name: Create encrypted credential directory
  ansible.builtin.file:
    path: /etc/credstore.encrypted
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Encrypt dead-man credentials with the Photon host key
  ansible.builtin.command:
    argv:
      - systemd-creds
      - encrypt
      - "--name={{ item.name }}"
      - '-'
      - "/etc/credstore.encrypted/{{ item.name }}.new"
    stdin: "{{ lookup('env', item.env) }}"
    stdin_add_newline: false
  loop:
    - {name: ca_crt, env: K3S_DEADMAN_CA_CERT}
    - {name: server_crt, env: K3S_DEADMAN_SERVER_CERT}
    - {name: server_key, env: K3S_DEADMAN_SERVER_KEY}
    - {name: ses_username, env: SES_SMTP_USERNAME}
    - {name: ses_password, env: SES_SMTP_PASSWORD}
  changed_when: true
  no_log: true

- name: Publish encrypted dead-man credentials atomically
  ansible.builtin.command:
    argv:
      - mv
      - -f
      - "/etc/credstore.encrypted/{{ item }}.new"
      - "/etc/credstore.encrypted/{{ item }}"
  loop: [ca_crt, server_crt, server_key, ses_username, ses_password]
  changed_when: true
  no_log: true
  notify: Restart k3s deadman

- name: Create local executable directory
  ansible.builtin.file:
    path: /usr/local/libexec
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install dead-man receiver
  ansible.builtin.copy:
    src: k3s_deadman.py
    dest: /usr/local/libexec/k3s-deadman
    owner: root
    group: root
    mode: "0755"
  notify: Restart k3s deadman

- name: Install dead-man systemd unit
  ansible.builtin.template:
    src: k3s-deadman.service.j2
    dest: /etc/systemd/system/k3s-deadman.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart k3s deadman

- name: Install dead-man firewall unit
  ansible.builtin.template:
    src: k3s-deadman-firewall.service.j2
    dest: /etc/systemd/system/k3s-deadman-firewall.service
    owner: root
    group: root
    mode: "0644"

- name: Enable dead-man firewall
  ansible.builtin.systemd:
    name: k3s-deadman-firewall.service
    enabled: true
    state: started
    daemon_reload: true

- name: Enable dead-man receiver
  ansible.builtin.systemd:
    name: k3s-deadman.service
    enabled: true
    state: started
    daemon_reload: true
