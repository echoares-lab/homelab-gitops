---
k3s_common_packages:
  - ca-certificates
  - curl
  - gnupg
  - iptables
  - nfs-common
  - open-iscsi
  - software-properties-common
k3s_common_kernel_modules:
  - overlay
  - br_netfilter
k3s_common_sysctl:
  net.bridge.bridge-nf-call-iptables: "1"
  net.bridge.bridge-nf-call-ip6tables: "1"
  net.ipv4.ip_forward: "1"
k3s_common_ufw_rules:
  - { port: "6443", proto: "tcp" }
  - { port: "10250", proto: "tcp" }
  - { port: "8472", proto: "udp" }
  - { port: "80", proto: "tcp" }
  - { port: "443", proto: "tcp" }
