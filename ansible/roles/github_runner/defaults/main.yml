---
runner_user: github-runner
runner_linux_group: github-runner
runner_home: /home/github-runner
runner_root: /opt/actions-runner
runner_work_dir: "{{ runner_root }}/_work"

runner_version: "2.317.0"
runner_tarball_url: "https://github.com/actions/runner/releases/download/v{{ runner_version }}/actions-runner-linux-x64-{{ runner_version }}.tar.gz"

# Org-level registration — token generated at:
#   github.com/organizations/echoares-lab/settings/actions/runners/new
# Runner appears in every repo in the org (restricted by runner group policy).
#
# Required at runtime or via vault:
#   runner_token  - short-lived registration token (expires 1h after generation)
#
# Optional overrides:
#   runner_name         - defaults to inventory_hostname
#   runner_extra_labels - comma-separated, appended to "self-hosted,Linux,X64"
#   runner_actions_group - GitHub Actions runner group (default: "Default")

runner_github_url: "https://github.com/echoares-lab"
runner_token: ""
runner_name: "{{ inventory_hostname }}"
runner_extra_labels: ""
runner_actions_group: "Default"

runner_uid: 1500
runner_gid: 1500
