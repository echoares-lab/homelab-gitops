---
- name: Validate required variables
  ansible.builtin.assert:
    that:
      - runner_github_url | length > 0
    fail_msg: "runner_github_url must be set"

- name: Create runner Linux group
  ansible.builtin.group:
    name: "{{ runner_linux_group }}"
    gid: "{{ runner_gid }}"
    state: present

- name: Create runner user
  ansible.builtin.user:
    name: "{{ runner_user }}"
    group: "{{ runner_linux_group }}"
    uid: "{{ runner_uid }}"
    home: "{{ runner_home }}"
    shell: /bin/bash
    system: false
    create_home: true
    state: present

- name: Add runner user to docker group (for Docker-in-workflow steps)
  ansible.builtin.user:
    name: "{{ runner_user }}"
    groups: docker
    append: true
  failed_when: false

- name: Create runner root directory
  ansible.builtin.file:
    path: "{{ runner_root }}"
    state: directory
    owner: "{{ runner_user }}"
    group: "{{ runner_linux_group }}"
    mode: "0755"

- name: Create runner work directory
  ansible.builtin.file:
    path: "{{ runner_work_dir }}"
    state: directory
    owner: "{{ runner_user }}"
    group: "{{ runner_linux_group }}"
    mode: "0755"

- name: Ensure runner cache dirs are writable
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ runner_user }}"
    group: "{{ runner_linux_group }}"
    mode: "0755"
  loop:
    - "{{ runner_home }}/.cache"
    - "{{ runner_home }}/go"
    - "{{ runner_home }}/go/pkg"
    - "{{ runner_home }}/.npm"

- name: Copy project files to runner home
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ runner_home }}/{{ item }}"
    owner: "{{ runner_user }}"
    group: "{{ runner_linux_group }}"
    mode: "0644"
  loop:
    - requirements.txt
    - pyproject.toml

- name: Check installed runner version
  ansible.builtin.command: cat "{{ runner_root }}/bin/Runner.Listener.deps.json"
  register: runner_version_check
  changed_when: false
  failed_when: false

- name: Download GitHub Actions runner tarball
  ansible.builtin.get_url:
    url: "{{ runner_tarball_url }}"
    dest: "/tmp/actions-runner-{{ runner_version }}.tar.gz"
    mode: "0644"
  when: runner_version_check.rc != 0 or runner_version not in (runner_version_check.stdout | default(''))

- name: Extract runner tarball
  ansible.builtin.unarchive:
    src: "/tmp/actions-runner-{{ runner_version }}.tar.gz"
    dest: "{{ runner_root }}"
    remote_src: true
    owner: "{{ runner_user }}"
    group: "{{ runner_linux_group }}"
  when: runner_version_check.rc != 0 or runner_version not in (runner_version_check.stdout | default(''))

- name: Fix runner directory ownership
  ansible.builtin.file:
    path: "{{ runner_root }}"
    owner: "{{ runner_user }}"
    group: "{{ runner_linux_group }}"
    recurse: true

- name: Check if runner is already configured
  ansible.builtin.stat:
    path: "{{ runner_root }}/.runner"
  register: runner_configured

- name: Configure runner (org-level)
  ansible.builtin.command:
    cmd: >
      ./config.sh
      --url {{ runner_github_url }}
      --token {{ runner_token }}
      --name {{ runner_name }}
      --work {{ runner_work_dir }}
      --labels self-hosted,Linux,X64{{ (',' + runner_extra_labels) if runner_extra_labels else '' }}
      --runnergroup {{ runner_actions_group }}
      --unattended
      --replace
    chdir: "{{ runner_root }}"
  become_user: "{{ runner_user }}"
  when: 
    - not runner_configured.stat.exists
    - runner_token | default('') | length > 0
  no_log: true

- name: Install runner as systemd service
  ansible.builtin.command:
    cmd: ./svc.sh install {{ runner_user }}
    chdir: "{{ runner_root }}"
  register: svc_install
  changed_when: "'already installed' not in svc_install.stdout"
  failed_when: 
    - svc_install.rc != 0 
    - "'already installed' not in svc_install.stderr"
    - "'exists' not in svc_install.stderr"
  when: runner_token | default('') | length > 0

- name: Start and enable runner service
  ansible.builtin.command:
    cmd: ./svc.sh start
    chdir: "{{ runner_root }}"
  register: svc_start
  changed_when: "'started' in svc_start.stdout"
  failed_when: svc_start.rc != 0 and 'already running' not in svc_start.stderr
  when: runner_token | default('') | length > 0

- name: Verify runner service is active
  ansible.builtin.command: ./svc.sh status
  args:
    chdir: "{{ runner_root }}"
  changed_when: false
  register: runner_status

- name: Show runner service status
  ansible.builtin.debug:
    msg: "{{ runner_status.stdout_lines }}"
