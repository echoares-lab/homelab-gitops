---
- name: Ensure k3s config directory exists
  ansible.builtin.file:
    path: "{{ k3s_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Write k3s server config
  ansible.builtin.copy:
    dest: "{{ k3s_config_dir }}/config.yaml"
    owner: root
    group: root
    mode: "0644"
    content: |
      write-kubeconfig-mode: "0644"
  notify: Restart k3s

- name: Install single-server k3s
  ansible.builtin.shell: |
    set -eu
    curl -sfL {{ k3s_install_url }} | INSTALL_K3S_EXEC='{{ k3s_install_exec }}' sh -
  args:
    creates: /usr/local/bin/k3s
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"

- name: Ensure k3s service is enabled and started
  ansible.builtin.systemd:
    name: k3s
    enabled: true
    state: started

- name: Wait for Kubernetes API
  ansible.builtin.command: k3s kubectl get nodes
  register: k3s_nodes
  changed_when: false
  retries: 20
  delay: 6
  until: k3s_nodes.rc == 0

- name: Ensure local-path storage class exists
  ansible.builtin.command: k3s kubectl get storageclass local-path
  register: k3s_local_path
  changed_when: false
  failed_when: false

- name: Mark local-path as default storage class
  ansible.builtin.command: >
    k3s kubectl annotate storageclass local-path
    storageclass.kubernetes.io/is-default-class=true --overwrite
  changed_when: true
  when: k3s_local_path.rc == 0
