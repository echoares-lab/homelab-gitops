---
- name: Configure udev rule for APC USB permissions
  ansible.builtin.copy:
    content: 'SUBSYSTEM=="usb", ATTRS{idVendor}=="051d", ATTRS{idProduct}=="0002", MODE="0666"'
    dest: /etc/udev/rules.d/99-apc-ups.rules
    owner: root
    group: root
    mode: '0644'
  register: nut_ups_udev_rule

- name: Reload udev rules and trigger
  ansible.builtin.command:
    cmd: "{{ item }}"
  loop:
    - udevadm control --reload-rules
    - udevadm trigger
  when: nut_ups_udev_rule.changed | default(false)

- name: Ensure target directories exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: /opt/nut, owner: root, group: root, mode: '0755' }
    - { path: /opt/nut/config, owner: '100', group: '101', mode: '0750' }
    - { path: /opt/nut/peanut, owner: '1000', group: '1000', mode: '0755' }

- name: Render NUT configuration files
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/opt/nut/config/{{ item }}"
    owner: '100'
    group: '101'
    mode: '0640'
  loop:
    - nut.conf
    - ups.conf
    - upsd.conf
    - upsd.users
    - upsmon.conf
  notify: Restart NUT Docker Compose stack

- name: Render Docker Compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: /opt/nut/docker-compose.yml
    owner: root
    group: root
    mode: '0644'
  notify: Restart NUT Docker Compose stack

- name: Pull and start NUT Docker Compose stack
  ansible.builtin.command:
    cmd: docker compose up -d
    chdir: /opt/nut
  register: nut_ups_compose_up
  changed_when: "'Created' in nut_ups_compose_up.stdout or 'Started' in nut_ups_compose_up.stdout or 'Recreated' in nut_ups_compose_up.stdout"
