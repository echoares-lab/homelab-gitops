---
- name: Ensure mcpadmin user exists
  ansible.builtin.user:
    name: mcpadmin
    state: present
    groups: docker,wheel
    append: yes
    create_home: yes
    shell: /bin/bash

- name: Setup passwordless sudo for wheel and sudo groups
  ansible.builtin.copy:
    dest: /etc/sudoers.d/99-nopasswd
    content: |
      %wheel ALL=(ALL:ALL) NOPASSWD: ALL
      %sudo ALL=(ALL:ALL) NOPASSWD: ALL
    mode: '0440'

- name: Create .ssh directory for mcpadmin
  ansible.builtin.file:
    path: /home/mcpadmin/.ssh
    state: directory
    mode: '0700'
    owner: mcpadmin
    group: mcpadmin

- name: Copy authorized_keys from ansible to mcpadmin
  ansible.builtin.copy:
    src: /home/ansible/.ssh/authorized_keys
    dest: /home/mcpadmin/.ssh/authorized_keys
    remote_src: yes
    mode: '0600'
    owner: mcpadmin
    group: mcpadmin
  ignore_errors: true

- name: Create MCP Gateway deployment directory
  ansible.builtin.file:
    path: /home/mcpadmin/mcp-gateway
    state: directory
    mode: '0755'
    owner: mcpadmin
    group: mcpadmin

- name: Template docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: /home/mcpadmin/mcp-gateway/docker-compose.yml
    owner: mcpadmin
    group: mcpadmin
    mode: '0644'

- name: Ensure MCP Gateway is running
  community.docker.docker_compose_v2:
    project_src: /home/mcpadmin/mcp-gateway
    state: present
  become: yes
  become_user: mcpadmin
