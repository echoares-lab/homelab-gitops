# File: roles/technitium_photon/handlers/main.yml
# Purpose: Handlers for systemd reloads, Technitium restarts, and firewall reloads.
# Usage: Called automatically by tasks when service files, extracted app files, or firewall rules change.
---
- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: Restart Technitium DNS
  ansible.builtin.systemd:
    name: "{{ technitium_service_name }}"
    state: restarted

- name: Reload firewalld
  ansible.builtin.command:
    cmd: firewall-cmd --reload
  changed_when: true
