# File: roles/technitium_photon/tasks/main.yml
# Purpose: Install and configure Technitium DNS Server on VMware Photon OS with DHCP-capable firewall rules.
# Usage: Include role technitium_photon from a playbook targeting Photon OS hosts with become: true.
---
- name: Assert Photon OS target
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution'] is search('Photon')
    fail_msg: "This role is intended for VMware Photon OS. Detected: {{ ansible_facts['distribution'] | default('unknown') }}"

- name: Install required Photon packages
  ansible.builtin.command:
    cmd: "tdnf install -y curl tar gzip shadow icu"
  register: technitium_tdnf
  changed_when: "'Nothing to do' not in technitium_tdnf.stdout and 'already installed' not in technitium_tdnf.stdout"
  failed_when: technitium_tdnf.rc != 0

- name: Create Technitium directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ technitium_base_dir }}"
    - "{{ technitium_app_dir }}"
    - "{{ technitium_config_dir }}"
    - "{{ technitium_log_dir }}"
    - "{{ technitium_dotnet_dir }}"

- name: Check installed dotnet runtimes
  ansible.builtin.command: dotnet --list-runtimes
  register: technitium_dotnet_runtimes
  changed_when: false
  failed_when: false

- name: Download dotnet install script
  ansible.builtin.get_url:
    url: "{{ technitium_dotnet_install_url }}"
    dest: /tmp/dotnet-install.sh
    mode: "0755"
  when: technitium_dotnet_runtime_match not in technitium_dotnet_runtimes.stdout

- name: Install ASP.NET Core runtime
  ansible.builtin.command:
    cmd: >
      /tmp/dotnet-install.sh
      -c {{ technitium_dotnet_channel }}
      --runtime aspnetcore
      --no-path
      --install-dir {{ technitium_dotnet_dir }}
      --verbose
  when: technitium_dotnet_runtime_match not in technitium_dotnet_runtimes.stdout
  notify: Restart Technitium DNS

- name: Symlink dotnet into /usr/bin
  ansible.builtin.file:
    src: "{{ technitium_dotnet_dir }}/dotnet"
    dest: /usr/bin/dotnet
    state: link

- name: Create Technitium service group
  ansible.builtin.group:
    name: "{{ technitium_service_user }}"
    system: true

- name: Create Technitium service user
  ansible.builtin.user:
    name: "{{ technitium_service_user }}"
    group: "{{ technitium_service_user }}"
    system: true
    create_home: false
    shell: /sbin/nologin

- name: Download Technitium portable tarball
  ansible.builtin.get_url:
    url: "{{ technitium_download_url }}"
    dest: "{{ technitium_app_dir }}/DnsServerPortable.tar.gz"
    mode: "0644"
  register: technitium_tarball

- name: Extract Technitium DNS Server
  ansible.builtin.unarchive:
    src: "{{ technitium_app_dir }}/DnsServerPortable.tar.gz"
    dest: "{{ technitium_app_dir }}"
    remote_src: true
  when: technitium_tarball.changed
  notify: Restart Technitium DNS

- name: Test ICU support
  ansible.builtin.command:
    cmd: "dotnet {{ technitium_app_dir }}/DnsServerApp.dll --icu-test"
  changed_when: false
  when: technitium_validate_icu

- name: Set Technitium ownership
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ technitium_service_user }}"
    group: "{{ technitium_service_user }}"
    recurse: true
  loop:
    - "{{ technitium_app_dir }}"
    - "{{ technitium_config_dir }}"
    - "{{ technitium_log_dir }}"

- name: Install Technitium systemd service
  ansible.builtin.template:
    src: dns.service.j2
    dest: "/etc/systemd/system/{{ technitium_service_name }}.service"
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart Technitium DNS

- name: Disable systemd-resolved
  ansible.builtin.systemd:
    name: systemd-resolved
    enabled: false
    state: stopped
  failed_when: false
  when: technitium_disable_systemd_resolved
  notify: Restart Technitium DNS

- name: Enable and start Technitium DNS service
  ansible.builtin.systemd:
    name: "{{ technitium_service_name }}"
    enabled: true
    state: started
    daemon_reload: true

- name: Backup current resolv.conf
  ansible.builtin.copy:
    src: /etc/resolv.conf
    dest: "{{ technitium_app_dir }}/resolv.conf.bak"
    remote_src: true
    force: false
  when: technitium_set_local_resolver

- name: Point host resolver to local Technitium
  ansible.builtin.copy:
    dest: /etc/resolv.conf
    content: |
      # File: /etc/resolv.conf
      # Purpose: Managed by Ansible role technitium_photon so this host resolves through local Technitium.
      nameserver {{ technitium_resolv_conf_nameserver }}
    owner: root
    group: root
    mode: "0644"
  when: technitium_set_local_resolver

- name: Open Technitium firewall ports (Photon/iptables)
  ansible.builtin.iptables:
    chain: INPUT
    protocol: "{{ item.protocol }}"
    destination_port: "{{ item.port }}"
    jump: ACCEPT
    action: insert
  loop: "{{ technitium_firewall_ports + technitium_optional_firewall_ports }}"
  when: technitium_open_firewall and ansible_facts['distribution'] == 'VMware Photon OS'
  notify: Save iptables

- name: Open Technitium firewall ports (Ubuntu/firewalld)
  ansible.posix.firewalld:
    port: "{{ item.port }}/{{ item.protocol }}"
    permanent: true
    immediate: true
    state: enabled
  loop: "{{ technitium_firewall_ports + technitium_optional_firewall_ports }}"
  when: technitium_open_firewall and ansible_facts['distribution'] == 'Ubuntu'
  notify: Reload firewalld

- name: Wait for Technitium API to be ready
  ansible.builtin.uri:
    url: "http://127.0.0.1:5380/api/settings/get"
    method: GET
    status_code: 200
  register: technitium_api_ready
  until: technitium_api_ready.status == 200
  retries: 10
  delay: 5

- name: Configure Technitium DNS Settings (Recursion & Prefetch)
  ansible.builtin.uri:
    url: "http://127.0.0.1:5380/api/settings/set?token={{ lookup('env', 'TECHNITIUM_TOKEN') | default('dummy_token', true) }}&recursion={{ technitium_recursion }}&cachePrefetchTrigger={{ technitium_cache_prefetch_trigger }}&cachePrefetchEligibility={{ technitium_cache_prefetch_eligibility }}&saveCache={{ technitium_save_cache | lower }}&cacheMaximumEntries={{ technitium_cache_maximum_entries }}&serveStale={{ technitium_serve_stale | lower }}&serveStaleTtl={{ technitium_serve_stale_ttl }}&cachePrefetchSampleEligibilityHitsPerHour={{ technitium_cache_prefetch_sample_eligibility_hits_per_hour }}&maxConcurrentResolutionsPerCore={{ technitium_max_concurrent_resolutions_per_core }}&resolverConcurrency={{ technitium_resolver_concurrency }}&resolverTimeout={{ technitium_resolver_timeout }}&resolverMaxStackCount={{ technitium_resolver_max_stack_count }}&qpmPrefixLimitsIPv4={{ technitium_qpm_limit_ipv4 | urlencode }}&qpmLimitBypassList={{ technitium_qpm_bypass_list | urlencode }}"
    method: GET
    status_code: 200
  register: technitium_settings_update
  changed_when: "technitium_settings_update.json.status == 'ok'"
  failed_when: "technitium_settings_update.json.status != 'ok' and 'Invalid token' not in technitium_settings_update.json.errorMessage | default('')"

- name: Install bindutils (for dig)
  ansible.builtin.command: tdnf install -y bindutils
  register: tdnf_bind
  changed_when: "'Nothing to do' not in tdnf_bind.stdout"
  when: ansible_facts['distribution'] == 'VMware Photon OS'

- name: Deploy DNS Heartbeat script
  ansible.builtin.copy:
    src: dns_heartbeat.py
    dest: "{{ technitium_app_dir }}/dns_heartbeat.py"
    owner: "{{ technitium_service_user }}"
    group: "{{ technitium_service_user }}"
    mode: "0755"

- name: Stop and disable DNS Heartbeat timer
  ansible.builtin.systemd:
    name: dns-heartbeat.timer
    enabled: false
    state: stopped
  ignore_errors: true

- name: Install DNS Heartbeat systemd service
  ansible.builtin.template:
    src: dns-heartbeat.service.j2
    dest: /etc/systemd/system/dns-heartbeat.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Enable and start DNS Heartbeat service
  ansible.builtin.systemd:
    name: dns-heartbeat.service
    enabled: true
    state: started
    daemon_reload: true
