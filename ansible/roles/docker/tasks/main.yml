---
- name: Install Docker (Photon OS)
  ansible.builtin.command: tdnf install -y docker
  register: docker_install_photon
  changed_when: "'Nothing to do' not in docker_install_photon.stdout"
  when: ansible_facts['distribution'] == 'VMware Photon OS'

- name: Install Docker (Ubuntu)
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-compose-v2
    state: present
    update_cache: true
  when: ansible_facts['distribution'] == 'Ubuntu'

- name: Install Docker Compose (Photon OS)
  ansible.builtin.command: tdnf install -y docker-compose
  register: compose_install_photon
  changed_when: "'Nothing to do' not in compose_install_photon.stdout"
  when: ansible_facts['distribution'] == 'VMware Photon OS'

- name: Enable and start Docker service
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started
