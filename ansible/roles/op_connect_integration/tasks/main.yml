---
# 1Password Connect Integration Role

- name: Install dependencies (gpg)
  ansible.builtin.apt:
    name: gnupg
    state: present
  when: ansible_os_family == 'Debian'

- name: Add 1Password GPG key (Debian/Ubuntu)
  ansible.builtin.get_url:
    url: https://downloads.1password.com/linux/keys/1password.asc
    dest: /usr/share/keyrings/1password.asc
    mode: '0644'
  when: ansible_os_family == 'Debian'

- name: Dearmor 1Password GPG key (Debian/Ubuntu)
  ansible.builtin.command:
    cmd: gpg --dearmor --yes --output /usr/share/keyrings/1password-archive-keyring.gpg /usr/share/keyrings/1password.asc
    creates: /usr/share/keyrings/1password-archive-keyring.gpg
  when: ansible_os_family == 'Debian'

- name: Add 1Password APT repository (Debian/Ubuntu)
  ansible.builtin.apt_repository:
    repo: 'deb [arch=amd64 signed-by=/usr/share/keyrings/1password-archive-keyring.gpg] https://downloads.1password.com/linux/debian/amd64 stable main'
    state: present
    filename: 1password
  when: ansible_os_family == 'Debian'

- name: Ensure op CLI is installed
  ansible.builtin.apt:
    name: 1password
    state: present
    update_cache: true
  register: op_connect_integration_install
  changed_when: op_connect_integration_install.changed | default(false)
  when: ansible_os_family == 'Debian'

- name: Verify Connect server is reachable
  ansible.builtin.uri:
    url: "{{ op_connect_integration_server }}/health"
    method: GET
    status_code: 200
  register: op_connect_integration_health
  retries: 3
  delay: 5
  until: op_connect_integration_health.status == 200

- name: Test Connect authentication
  ansible.builtin.uri:
    url: "{{ op_connect_integration_server }}/v1/vaults"
    headers:
      Authorization: "Bearer {{ lookup('env', 'OP_CONNECT_TOKEN') }}"
    method: GET
    status_code: 200

- name: Set up op run environment
  ansible.builtin.lineinfile:
    path: /etc/environment
    line: >-
      OP_CONNECT_TOKEN={{
      lookup('env', 'OP_CONNECT_TOKEN') }}
    state: present
  become: true

- name: Ensure op-connect directory exists
  ansible.builtin.file:
    path: /etc/op-connect
    state: directory
    mode: "0755"
  become: true

- name: Document op integration
  ansible.builtin.copy:
    content: |
      # 1Password Connect Integration

      To use secrets in Ansible:

      ```bash
      export OP_CONNECT_TOKEN=$(cat {{ op_connect_integration_token_path }})
      op run --server {{ op_connect_integration_server }} -- <command>
      ```

      Or use in tasks:
      ```yaml
      - name: Get secret from vault
        shell: |
          op run --server {{ op_connect_integration_server }} -- \
            op read op://homelab-gitops/prod/SECRET_NAME
        environment: "{{ op_connect_integration_env }}"
      ```
    dest: /etc/op-connect/ANSIBLE_USAGE.txt
    mode: "0644"
  become: true

- name: Print Connect status
  ansible.builtin.debug:
    msg: |
      ✓ 1Password Connect Integration Ready

      Server: {{ op_connect_integration_server }}
      Token: {{ op_connect_integration_token_path }}

      Usage: op run --server {{ op_connect_integration_server }} \
        -- <command>
