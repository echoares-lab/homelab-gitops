---
# 1Password Connect Integration Defaults

# Connect server configuration
op_connect_integration_server: "https://10.10.10.30:8200"
op_connect_integration_token_path: "/etc/op-connect/token"

# Token file permissions
op_connect_integration_token_mode: "0600"
op_connect_integration_token_owner: "root"

# Environment variable for op run
op_connect_integration_env:
  OP_CONNECT_TOKEN: "{{ lookup('file', op_connect_integration_token_path) }}"
