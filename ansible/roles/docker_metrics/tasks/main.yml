---
- name: Create Docker certs directory
  ansible.builtin.file:
    path: "{{ docker_metrics_cert_path }}"
    state: directory
    mode: "0700"

- name: Distribute CA certificate
  ansible.builtin.copy:
    src: ca.crt
    dest: "{{ docker_metrics_cert_path }}/ca.crt"
    owner: root
    group: root
    mode: "0644"
  notify: Restart Docker daemon

- name: Distribute server certificate
  ansible.builtin.copy:
    src: server.crt
    dest: "{{ docker_metrics_cert_path }}/server.crt"
    owner: root
    group: root
    mode: "0644"
  notify: Restart Docker daemon

- name: Distribute server key
  ansible.builtin.copy:
    src: server.key
    dest: "{{ docker_metrics_cert_path }}/server.key"
    owner: root
    group: root
    mode: "0600"
  notify: Restart Docker daemon

- name: Read current Docker daemon config
  ansible.builtin.slurp:
    src: "{{ docker_metrics_daemon_config_file }}"
  register: docker_metrics_config_b64
  failed_when: false

- name: Parse Docker daemon config  # noqa line-length
  ansible.builtin.set_fact:
    docker_metrics_config: >-
      {{
        (docker_metrics_config_b64.content | b64decode | from_json)
        if docker_metrics_config_b64.stat is defined
        else {}
      }}

- name: Update Docker daemon config for TLS and metrics
  ansible.builtin.copy:
    content: |
      {
        "tlscert": "{{ docker_metrics_cert_path }}/server.crt",
        "tlskey": "{{ docker_metrics_cert_path }}/server.key",
        "tlscacert": "{{ docker_metrics_cert_path }}/ca.crt",
        "tls": true,
        "hosts": [
          "unix:///var/run/docker.sock",
          "tcp://0.0.0.0:{{ docker_metrics_tls_port }}"
        ],
        "metrics-addr": "0.0.0.0:9323",
        "experimental": true
      }
    dest: "{{ docker_metrics_daemon_config_file }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart Docker daemon
  when: docker_metrics_enabled | bool

- name: Register node with Dockhand via API
  ansible.builtin.uri:
    url: "{{ dockhand_api_url | default('http://10.10.10.30:3001/api/environments') }}"
    method: POST
    headers:
      Authorization: "Bearer {{ dockhand_api_token | default('') }}"
      Accept: "application/json"
    body_format: json
    body:
      name: "{{ inventory_hostname }}"
      host: "{{ inventory_hostname }}"
      port: "{{ docker_metrics_tls_port }}"
      tls: true
    status_code: [200, 201, 409] # 409 usually means already exists
  ignore_errors: true
  when: dockhand_api_token is defined and dockhand_api_token != ''

- name: Register node with Uptime Kuma via REST API
  ansible.builtin.uri:
    url: "{{ uptime_kuma_api_url | default('http://10.10.10.30:3000/api/monitor') }}"
    method: POST
    headers:
      Authorization: "Bearer {{ uptime_kuma_api_token | default('') }}"
      Accept: "application/json"
    body_format: json
    body:
      name: "{{ inventory_hostname }} Docker Daemon"
      type: "docker"
      docker_host: "tcp://{{ inventory_hostname }}:{{ docker_metrics_tls_port }}"
    status_code: [200, 201, 400] # 400 might be returned if it already exists
  ignore_errors: true
  when: uptime_kuma_api_token is defined and uptime_kuma_api_token != ''

