---
- name: Validate required variables
  ansible.builtin.assert:
    that:
      - github_pat | length > 0
    fail_msg: "github_pat must be set — pass via -e or vault (needs repo + read:org scope)"

# ── Dev user ──────────────────────────────────────────────────────────────────
- name: Create dev group
  ansible.builtin.group:
    name: "{{ dev_group }}"
    gid: "{{ dev_gid }}"
    state: present

- name: Create dev user
  ansible.builtin.user:
    name: "{{ dev_user }}"
    group: "{{ dev_group }}"
    uid: "{{ dev_uid }}"
    home: "{{ dev_home }}"
    shell: /bin/bash
    create_home: true
    groups:
      - sudo
    append: true
    state: present

- name: Configure passwordless sudo for sudo group
  ansible.builtin.copy:
    dest: /etc/sudoers.d/99-nopasswd
    content: "%sudo ALL=(ALL:ALL) NOPASSWD: ALL\n"
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s

- name: Copy Ansible SSH public key to developer authorized_keys
  ansible.posix.authorized_key:
    user: "{{ dev_user }}"
    key: "{{ ansible_admin_pubkey }}"
    state: present
  when: ansible_admin_pubkey | default('') | length > 0

- name: Add dev user to docker group
  ansible.builtin.user:
    name: "{{ dev_user }}"
    groups: docker
    append: true
  failed_when: false

- name: Create repos directory
  ansible.builtin.file:
    path: "{{ dev_home }}/repos"
    state: directory
    owner: "{{ dev_user }}"
    group: "{{ dev_group }}"
    mode: "0755"

# ── Node.js ───────────────────────────────────────────────────────────────────
- name: Check if NodeSource repo is already configured
  ansible.builtin.stat:
    path: /etc/apt/sources.list.d/nodesource.list
  register: nodesource_list

- name: Download and run NodeSource setup script
  ansible.builtin.shell:
    cmd: curl -fsSL https://deb.nodesource.com/setup_{{ node_major_version }}.x | bash -
  changed_when: true
  when: not nodesource_list.stat.exists

- name: Install Node.js
  ansible.builtin.apt:
    name: nodejs
    state: present
    update_cache: true

# ── Go ────────────────────────────────────────────────────────────────────────
- name: Check current Go version
  ansible.builtin.command: /usr/local/go/bin/go version
  register: current_go_version
  changed_when: false
  failed_when: false

- name: Install Go from upstream tarball
  when: current_go_version.rc != 0 or go_version not in current_go_version.stdout
  block:
    - name: Download Go tarball
      ansible.builtin.get_url:
        url: "{{ go_tarball_url }}"
        dest: "/tmp/go{{ go_version }}.linux-amd64.tar.gz"
        mode: "0644"

    - name: Remove existing Go installation
      ansible.builtin.file:
        path: "{{ go_install_dir }}/go"
        state: absent

    - name: Extract Go tarball
      ansible.builtin.unarchive:
        src: "/tmp/go{{ go_version }}.linux-amd64.tar.gz"
        dest: "{{ go_install_dir }}"
        remote_src: true

- name: Add Go to system PATH
  ansible.builtin.copy:
    dest: /etc/profile.d/go.sh
    content: |
      export PATH=$PATH:{{ go_install_dir }}/go/bin
      export GOPATH=$HOME/go
    mode: "0644"

# ── Playwright system deps ────────────────────────────────────────────────────
- name: Install Playwright system deps
  ansible.builtin.apt:
    name: "{{ playwright_packages }}"
    state: present

# ── GitHub CLI ────────────────────────────────────────────────────────────────
- name: Check if GitHub CLI keyring is present
  ansible.builtin.stat:
    path: /usr/share/keyrings/githubcli-archive-keyring.gpg
  register: gh_keyring

- name: Add GitHub CLI apt repository
  when: not gh_keyring.stat.exists
  block:
    - name: Download GitHub CLI apt key
      ansible.builtin.shell:
        cmd: curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | gpg --dearmor -o /usr/share/keyrings/githubcli-archive-keyring.gpg
      changed_when: true

    - name: Add GitHub CLI apt repository entry
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64 signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main"
        state: present
        filename: github-cli

# ── HashiCorp apt repo (Packer) ───────────────────────────────────────────────
- name: Check if HashiCorp keyring is present
  ansible.builtin.stat:
    path: /usr/share/keyrings/hashicorp-archive-keyring.gpg
  register: hashicorp_keyring
  when: install_packer

- name: Add HashiCorp apt repository
  when: install_packer and not hashicorp_keyring.stat.exists
  block:
    - name: Download HashiCorp apt key
      ansible.builtin.shell:
        cmd: curl -fsSL https://apt.releases.hashicorp.com/gpg | gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
      changed_when: true

    - name: Add HashiCorp apt repository entry
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64 signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com noble main"
        state: present
        filename: hashicorp

# ── Apt packages ──────────────────────────────────────────────────────────────
- name: Install combined dev apt packages
  ansible.builtin.apt:
    name: "{{ cf_dev_apt_packages + ['python3', 'python3-pip', 'python3-venv', 'packer'] }}"
    state: present
    update_cache: true

# ── Python packages ───────────────────────────────────────────────────────────
- name: Install homelab Python packages
  ansible.builtin.pip:
    name: "{{ homelab_pip_packages }}"
    state: present
    extra_args: "--upgrade"

# ── OpenTofu ──────────────────────────────────────────────────────────────────
- name: Check current OpenTofu version
  ansible.builtin.command: tofu version
  register: tofu_check
  changed_when: false
  failed_when: false
  when: install_tofu

- name: Install OpenTofu
  when: install_tofu and (tofu_check.rc != 0 or tofu_version not in tofu_check.stdout)
  block:
    - name: Download OpenTofu deb
      ansible.builtin.get_url:
        url: "https://github.com/opentofu/opentofu/releases/download/v{{ tofu_version }}/tofu_{{ tofu_version }}_amd64.deb"
        dest: "/tmp/tofu_{{ tofu_version }}_amd64.deb"
        mode: "0644"

    - name: Install OpenTofu deb
      ansible.builtin.apt:
        deb: "/tmp/tofu_{{ tofu_version }}_amd64.deb"

# ── govc ──────────────────────────────────────────────────────────────────────
- name: Check if govc is installed
  ansible.builtin.command: govc version
  register: govc_check
  changed_when: false
  failed_when: false
  when: install_govc

- name: Install govc
  when: install_govc and govc_check.rc != 0
  block:
    - name: Get latest govc release tag
      ansible.builtin.uri:
        url: https://api.github.com/repos/vmware/govmomi/releases/latest
        return_content: true
      register: govc_release

    - name: Download and extract govc
      ansible.builtin.shell:
        cmd: >
          curl -fsSL "https://github.com/vmware/govmomi/releases/download/{{ (govc_release.content | from_json).tag_name }}/govc_Linux_x86_64.tar.gz"
          | tar -xz -C /tmp govc &&
          mv /tmp/govc {{ bin_dir }}/govc &&
          chmod 0755 {{ bin_dir }}/govc
      changed_when: true

# ── golangci-lint ─────────────────────────────────────────────────────────────
- name: Check if golangci-lint is installed
  ansible.builtin.command: golangci-lint version
  register: golangci_check
  changed_when: false
  failed_when: false
  when: install_golangci_lint

- name: Install golangci-lint
  ansible.builtin.shell: >
    curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh |
    sh -s -- -b {{ bin_dir }} v{{ golangci_lint_version }}
  changed_when: true
  when: install_golangci_lint and (golangci_check.rc != 0 or golangci_lint_version not in golangci_check.stdout)

# ── actionlint ────────────────────────────────────────────────────────────────
- name: Check if actionlint is installed
  ansible.builtin.command: which actionlint
  register: actionlint_check
  changed_when: false
  failed_when: false
  when: install_actionlint

- name: Install actionlint via go install
  ansible.builtin.shell: |
    /usr/local/go/bin/go install github.com/rhysd/actionlint/cmd/actionlint@latest
    cp /root/go/bin/actionlint {{ bin_dir }}/actionlint
    chmod 0755 {{ bin_dir }}/actionlint
  changed_when: true
  when: install_actionlint and actionlint_check.rc != 0

# ── Docker CE ─────────────────────────────────────────────────────────────────
- name: Install Docker CE
  when: install_docker
  block:
    - name: Check if Docker keyring is present
      ansible.builtin.stat:
        path: /usr/share/keyrings/docker-archive-keyring.gpg
      register: docker_keyring

    - name: Add Docker apt key
      ansible.builtin.shell:
        cmd: curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /usr/share/keyrings/docker-archive-keyring.gpg
      changed_when: true
      when: not docker_keyring.stat.exists

    - name: Add Docker apt repository
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64 signed-by=/usr/share/keyrings/docker-archive-keyring.gpg] https://download.docker.com/linux/ubuntu noble stable"
        state: present
        filename: docker

    - name: Install Docker CE packages
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Enable and start Docker
      ansible.builtin.systemd:
        name: docker
        enabled: true
        state: started

# ── Go dev tools (gopls, delve) ───────────────────────────────────────────────
- name: Install gopls and delve
  ansible.builtin.shell: |
    /usr/local/go/bin/go install golang.org/x/tools/gopls@latest
    /usr/local/go/bin/go install github.com/go-delve/delve/cmd/dlv@latest
    cp /root/go/bin/gopls {{ bin_dir }}/gopls
    cp /root/go/bin/dlv {{ bin_dir }}/dlv
  changed_when: true
  when: install_dev_go_tools

# ── gh CLI auth + repo clone ──────────────────────────────────────────────────
- name: Configure gh CLI auth
  ansible.builtin.shell:
    cmd: echo "{{ github_pat }}" | gh auth login --with-token
  become_user: "{{ dev_user }}"
  environment:
    HOME: "{{ dev_home }}"
  changed_when: true
  no_log: true

- name: Set default gh org
  ansible.builtin.command:
    cmd: gh config set default_hostname github.com
  become_user: "{{ dev_user }}"
  environment:
    HOME: "{{ dev_home }}"
  changed_when: false

- name: Check if repos are already cloned
  ansible.builtin.stat:
    path: "{{ dev_home }}/repos/{{ item }}"
  register: repo_stat
  loop: "{{ dev_repos }}"

- name: Clone repos via gh
  ansible.builtin.command:
    cmd: gh repo clone {{ github_org }}/{{ item.item }} {{ dev_home }}/repos/{{ item.item }}
    chdir: "{{ dev_home }}/repos"
  become_user: "{{ dev_user }}"
  environment:
    HOME: "{{ dev_home }}"
  when: not item.stat.exists
  loop: "{{ repo_stat.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Set git safe directories for dev user
  ansible.builtin.command:
    cmd: git config --global safe.directory {{ dev_home }}/repos/{{ item }}
  become_user: "{{ dev_user }}"
  environment:
    HOME: "{{ dev_home }}"
  changed_when: false
  loop: "{{ dev_repos }}"
