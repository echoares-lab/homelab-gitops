---
# --- Dev user ---
dev_user: developer
dev_group: developer
dev_uid: 1600
dev_gid: 1600
dev_home: "/home/{{ dev_user }}"

# --- SSH access ---
# Passed automatically by manage.py config from SSH_ADMIN_SSH_PUBKEY env var (vault)
ansible_admin_pubkey: ""

# --- Repos to clone (cloned into dev_home/repos/) ---
# github_pat must be set at runtime or via vault
github_pat: ""
github_org: "echoares-lab"
dev_repos:
  - cloudflare_access_automation
  - homelab-gitops

# --- Go ---
go_version: "1.22.4"
go_install_dir: /usr/local
go_tarball_url: "https://go.dev/dl/go{{ go_version }}.linux-amd64.tar.gz"

# --- Node.js ---
node_major_version: "20"

# --- Playwright system deps ---
playwright_packages:
  - libnss3
  - libnspr4
  - libatk1.0-0t64
  - libatk-bridge2.0-0t64
  - libcups2t64
  - libdrm2
  - libdbus-1-3
  - libxkbcommon0
  - libxcomposite1
  - libxdamage1
  - libxfixes3
  - libxrandr2
  - libgbm1
  - libasound2t64
  - chromium-browser

# --- Cloudflare Access dev tools ---
golangci_lint_version: "1.59.1"
bin_dir: /usr/local/bin

cf_dev_apt_packages:
  - gh
  - sqlite3
  - shellcheck
  - pre-commit

install_golangci_lint: true
install_actionlint: true
install_docker: true
install_dev_go_tools: true

# --- Homelab dev tools ---
tofu_version: "1.12.0"
install_tofu: true
install_govc: true
install_packer: true

homelab_pip_packages:
  - typer
  - rich
  - pyyaml
  - typing_extensions
  - pytest-testinfra
  - pexpect
  - ansible
