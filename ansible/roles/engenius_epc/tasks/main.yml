---
- name: Open required EPC ports (UFW)
  community.general.ufw:
    rule: allow
    port: "{{ item.port }}"
    proto: "{{ item.proto }}"
  loop:
    - { port: "80", proto: tcp }
    - { port: "443", proto: tcp }
    - { port: "8080", proto: tcp }
    - { port: "18120", proto: tcp }
    - { port: "1812", proto: udp }
    - { port: "1813", proto: udp }
  when: ansible_facts['distribution'] == 'Ubuntu'

- name: Ensure required packages are installed
  ansible.builtin.apt:
    name:
      - curl
      - wget
      - net-tools
      - sudo
    state: present
    update_cache: yes
  when: ansible_facts['distribution'] == 'Ubuntu'

- name: Create working directory for EPC installation
  ansible.builtin.file:
    path: /tmp/epc_installer
    state: directory
    mode: '0755'

- name: Download S3 epc.sh script
  ansible.builtin.get_url:
    url: "https://engenius-epc.s3.us-west-2.amazonaws.com/dev/1.9.0/epc.sh"
    dest: "/tmp/epc_installer/epc.sh"
    mode: '0755'

- name: Execute epc.sh script non-interactively
  ansible.builtin.command:
    cmd: ./epc.sh install 1.9.0
    chdir: /tmp/epc_installer
  args:
    creates: /epc/pipe/docker-compose.yml
  environment:
    USER: root
