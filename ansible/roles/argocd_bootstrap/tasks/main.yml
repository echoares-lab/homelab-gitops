---
- name: Create Argo CD namespace
  ansible.builtin.command: k3s kubectl create namespace {{ argocd_namespace }}
  register: argocd_namespace_create
  changed_when: argocd_namespace_create.rc == 0
  failed_when: argocd_namespace_create.rc not in [0, 1]

- name: Install Argo CD controllers
  ansible.builtin.command: >
    k3s kubectl apply -n {{ argocd_namespace }}
    -f {{ argocd_install_manifest_url }}
  register: argocd_install
  changed_when: "'configured' in argocd_install.stdout or 'created' in argocd_install.stdout"

- name: Wait for Argo CD application controller
  ansible.builtin.command: >
    k3s kubectl -n {{ argocd_namespace }} rollout status
    statefulset/argocd-application-controller --timeout=300s
  changed_when: false

- name: Write Argo CD root application manifest
  ansible.builtin.copy:
    dest: /tmp/argocd-root-application.yaml
    owner: root
    group: root
    mode: "0600"
    content: |
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: {{ argocd_app_name }}
        namespace: {{ argocd_namespace }}
      spec:
        project: {{ argocd_project }}
        source:
          repoURL: {{ argocd_repo_url }}
          targetRevision: {{ argocd_target_revision }}
          path: {{ argocd_app_path }}
        destination:
          server: https://kubernetes.default.svc
          namespace: default
        syncPolicy:
          automated:
            prune: true
            selfHeal: true
          syncOptions:
            - CreateNamespace=true

- name: Apply Argo CD root application
  ansible.builtin.command: k3s kubectl apply -f /tmp/argocd-root-application.yaml
  register: argocd_root_app
  changed_when: "'configured' in argocd_root_app.stdout or 'created' in argocd_root_app.stdout"
