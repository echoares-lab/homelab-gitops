---
# Tools for cloudflare_access_automation development.
# Assumes github_runner_base has already run (provides Go + Node.js).

golangci_lint_version: "1.59.1"
bin_dir: /usr/local/bin

cf_dev_apt_packages:
  - gh
  - sqlite3
  - shellcheck
  - pre-commit

install_golangci_lint: true
install_actionlint: true
install_docker: true
install_dev_go_tools: true
