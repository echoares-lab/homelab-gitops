---
# Mirrors scripts/setup.sh for a fully provisioned homelab-gitops dev machine.

# --- HashiCorp apt repo (Packer) ---
- name: Check if HashiCorp keyring is present
  ansible.builtin.stat:
    path: /usr/share/keyrings/hashicorp-archive-keyring.gpg
  register: hashicorp_keyring
  when: install_packer

- name: Add HashiCorp apt repository
  when: install_packer and not hashicorp_keyring.stat.exists
  block:
    - name: Download HashiCorp apt key
      ansible.builtin.shell:
        cmd: curl -fsSL https://apt.releases.hashicorp.com/gpg | gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
      changed_when: true

    - name: Add HashiCorp apt repository entry
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64 signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com noble main"
        state: present
        filename: hashicorp

- name: Install homelab apt packages
  ansible.builtin.apt:
    name: "{{ homelab_apt_packages }}"
    state: present
    update_cache: true

# --- Python packages (requirements.txt equiv) ---
- name: Install homelab Python packages
  ansible.builtin.pip:
    name: "{{ homelab_pip_packages }}"
    state: present
    extra_args: "--upgrade --break-system-packages --ignore-installed"

# --- OpenTofu ---
- name: Check current OpenTofu version
  ansible.builtin.command: tofu version
  register: tofu_check
  changed_when: false
  failed_when: false
  when: install_tofu

- name: Install OpenTofu
  when: install_tofu and (tofu_check.rc != 0 or tofu_version not in tofu_check.stdout)
  block:
    - name: Download OpenTofu deb
      ansible.builtin.get_url:
        url: "https://github.com/opentofu/opentofu/releases/download/v{{ tofu_version }}/tofu_{{ tofu_version }}_amd64.deb"
        dest: "/tmp/tofu_{{ tofu_version }}_amd64.deb"
        mode: "0644"

    - name: Install OpenTofu deb
      ansible.builtin.apt:
        deb: "/tmp/tofu_{{ tofu_version }}_amd64.deb"

# --- govc ---
- name: Check if govc is installed
  ansible.builtin.command: govc version
  register: govc_check
  changed_when: false
  failed_when: false
  when: install_govc

- name: Install govc
  when: install_govc and govc_check.rc != 0
  block:
    - name: Get latest govc release tag
      ansible.builtin.uri:
        url: https://api.github.com/repos/vmware/govmomi/releases/latest
        return_content: true
      register: govc_release

    - name: Download and extract govc
      ansible.builtin.shell:
        cmd: >
          curl -fsSL "https://github.com/vmware/govmomi/releases/download/{{ (govc_release.content | from_json).tag_name }}/govc_Linux_x86_64.tar.gz"
          | tar -xz -C /tmp govc &&
          mv /tmp/govc {{ bin_dir }}/govc &&
          chmod 0755 {{ bin_dir }}/govc
      changed_when: true
