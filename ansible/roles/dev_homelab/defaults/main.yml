---
# Tools for homelab-gitops development.
# Mirrors what scripts/setup.sh installs on a fresh machine.

tofu_version: "1.12.0"
bin_dir: /usr/local/bin

homelab_apt_packages:
  - python3
  - python3-pip
  - python3-venv
  - packer

homelab_pip_packages:
  - typer
  - rich
  - pyyaml
  - typing_extensions
  - pytest-testinfra
  - pexpect
  - paramiko
  - ansible

install_tofu: true
install_govc: true
install_packer: true
