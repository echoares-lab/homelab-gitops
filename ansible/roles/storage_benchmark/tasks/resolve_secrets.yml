---
- name: Resolve TrueNAS credentials from environment variables
  ansible.builtin.set_fact:
    truenas_api_key: "{{ lookup('env', 'TRUENAS_API_KEY') }}"
    iscsi_chap_user: "{{ lookup('env', 'TRUENAS_CHAP_USER') }}"
    iscsi_chap_secret: "{{ lookup('env', 'TRUENAS_CHAP_SECRET') }}"
    secrets_source: "env"
  delegate_to: localhost
  when:
    - truenas_api_key is not defined
    - lookup('env', 'TRUENAS_API_KEY') != ""

- name: Default secrets source to vars if key was pre-defined
  ansible.builtin.set_fact:
    secrets_source: "vars"
  when:
    - truenas_api_key is defined
    - secrets_source is not defined

- name: Probe OpenBao health
  ansible.builtin.uri:
    url: "http://10.10.10.30:8201/v1/sys/health"
    method: GET
    status_code: [200, 429, 472, 473, 501, 503]
    timeout: 5
  register: openbao_health
  failed_when: false
  delegate_to: localhost
  when: truenas_api_key is not defined

- name: Attempt OpenBao secret fetch
  ansible.builtin.uri:
    url: "http://10.10.10.30:8201/v1/kv/data/storage/truenas"
    method: GET
    headers:
      X-Vault-Token: "{{ lookup('env', 'VAULT_TOKEN') }}"
    status_code: [200, 403, 404]
    timeout: 5
  register: openbao_secret
  failed_when: false
  delegate_to: localhost
  when:
    - truenas_api_key is not defined
    - openbao_health.status is defined
    - openbao_health.status in [200, 429]

- name: Set credentials from OpenBao
  ansible.builtin.set_fact:
    truenas_api_key: "{{ openbao_secret.json.data.data.api_key }}"
    iscsi_chap_user: "{{ openbao_secret.json.data.data.iscsi_chap_user | default('') }}"
    iscsi_chap_secret: "{{ openbao_secret.json.data.data.iscsi_chap_secret | default('') }}"
    secrets_source: "openbao"
  no_log: true
  when:
    - truenas_api_key is not defined
    - openbao_secret is defined
    - openbao_secret.status is defined
    - openbao_secret.status == 200

- name: Fetch api_key from 1Password via op CLI
  ansible.builtin.shell: |
    unset OP_CONNECT_TOKEN OP_CONNECT_HOST
    op read "op://Homelab-GitOps/truenas-api/api_key" --no-newline
  register: _op_api_key
  delegate_to: localhost
  no_log: true
  changed_when: false
  when: truenas_api_key is not defined

- name: Set credentials from 1Password
  ansible.builtin.set_fact:
    truenas_api_key: "{{ _op_api_key.stdout }}"
    iscsi_chap_user: ""
    iscsi_chap_secret: ""
    secrets_source: "1password"
  no_log: true
  when: truenas_api_key is not defined and _op_api_key.stdout is defined

- name: Fail if no credentials resolved
  ansible.builtin.fail:
    msg: "Could not resolve TrueNAS credentials from Environment, OpenBao or 1Password Connect. Check TRUENAS_API_KEY, VAULT_TOKEN or OP_CONNECT_TOKEN."
  when: truenas_api_key is not defined

- name: Persist secrets source to state
  ansible.builtin.copy:
    dest: "{{ benchmark_run_dir }}/state.json"
    content: "{{ {'run_id': benchmark_run_id, 'secrets_source': secrets_source, 'completed': completed_backends} | to_json(indent=2) }}"
    mode: "0644"
  delegate_to: localhost
  become: false
