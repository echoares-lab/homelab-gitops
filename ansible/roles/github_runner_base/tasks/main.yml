---
- name: Wait for apt locks
  ansible.builtin.shell: |
    while fuser /var/lib/apt/lists/lock /var/lib/dpkg/lock /var/cache/apt/archives/lock >/dev/null 2>&1; do
      sleep 3
    done
  changed_when: false

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install base packages
  ansible.builtin.apt:
    name: "{{ runner_base_packages }}"
    state: present

- name: Expand root filesystem to fill runner virtual disk
  ansible.builtin.shell: |
    set -euo pipefail

    root_source="$(readlink -f "$(findmnt -no SOURCE /)")"
    root_fstype="$(findmnt -no FSTYPE /)"
    before_bytes="$(df --output=size -B1 / | awk 'NR == 2 { print $1 }')"
    lvm_root=0

    if [[ "${root_source}" == /dev/mapper/* ]] || [[ "$(lsblk -no TYPE "${root_source}" 2>/dev/null | awk 'NR == 1 { print $1 }')" == "lvm" ]]; then
      lvm_root=1
      root_parent="$(lsblk -no PKNAME "${root_source}" 2>/dev/null | awk 'NF { print $1; exit }')"
      if [[ -n "${root_parent}" ]]; then
        root_partition="/dev/${root_parent}"
      else
        root_partition="$(pvs --noheadings -o pv_name 2>/dev/null | awk 'NF { print $1; exit }')"
      fi
      if [[ -z "${root_partition}" ]]; then
        echo "Unable to identify root LVM physical volume"
        exit 1
      fi
    else
      root_partition="${root_source}"
    fi

    part_number="$(lsblk -no PARTN "${root_partition}" | awk 'NF { print $1; exit }')"
    parent_name="$(lsblk -no PKNAME "${root_partition}" | awk 'NF { print $1; exit }')"

    if [[ -z "${part_number}" || -z "${parent_name}" ]]; then
      echo "Unable to identify parent disk for ${root_partition}"
      exit 1
    fi

    parent_disk="/dev/${parent_name}"
    set +e
    growpart_output="$(growpart "${parent_disk}" "${part_number}" 2>&1)"
    growpart_rc=$?
    set -e

    if [[ "${growpart_rc}" -ne 0 ]]; then
      echo "${growpart_output}"
      if ! grep -qi "NOCHANGE" <<< "${growpart_output}"; then
        exit "${growpart_rc}"
      fi
    else
      echo "${growpart_output}"
    fi

    if ! grep -qi "NOCHANGE" <<< "${growpart_output}"; then
      echo "CHANGED partition"
    fi

    if [[ "${lvm_root}" -eq 1 ]]; then
      pvresize "${root_partition}"
      vg_name="$(lvs --noheadings -o vg_name "${root_source}" | awk 'NF { print $1; exit }')"
      free_extents="$(vgs --noheadings -o vg_free_count "${vg_name}" | awk 'NF { print $1; exit }')"
      if [[ "${free_extents:-0}" -gt 0 ]]; then
        lvextend -r -l +100%FREE "${root_source}"
        echo "CHANGED lvm"
      fi
    elif [[ "${root_fstype}" == "ext4" ]]; then
      resize2fs "${root_source}"
    elif [[ "${root_fstype}" == "xfs" ]]; then
      xfs_growfs /
    else
      echo "Unsupported root filesystem type: ${root_fstype}"
      exit 1
    fi

    after_bytes="$(df --output=size -B1 / | awk 'NR == 2 { print $1 }')"
    if [[ "${after_bytes}" -gt "${before_bytes}" ]]; then
      echo "CHANGED filesystem"
    fi
    echo "Root filesystem bytes: ${before_bytes} -> ${after_bytes}"
  args:
    executable: /bin/bash
  register: runner_resize_root
  changed_when: "'CHANGED' in runner_resize_root.stdout"

- name: Install Playwright system deps
  ansible.builtin.apt:
    name: "{{ playwright_packages }}"
    state: present
  when: install_playwright_deps

# --- Node.js via NodeSource ---
- name: Check if NodeSource repo is already configured
  ansible.builtin.stat:
    path: /etc/apt/sources.list.d/nodesource.list
  register: nodesource_list
  when: install_node

- name: Download NodeSource setup script
  ansible.builtin.get_url:
    url: "https://deb.nodesource.com/setup_{{ node_major_version }}.x"
    dest: /tmp/nodesource_setup.sh
    mode: "0755"
  when: install_node and not nodesource_list.stat.exists

- name: Run NodeSource setup script
  ansible.builtin.command: bash /tmp/nodesource_setup.sh
  changed_when: true
  when: install_node and not nodesource_list.stat.exists

- name: Install Node.js
  ansible.builtin.apt:
    name: nodejs
    state: present
    update_cache: true
  when: install_node

# --- Go ---
- name: Check current Go version
  ansible.builtin.command: /usr/local/go/bin/go version
  register: current_go_version
  changed_when: false
  failed_when: false
  when: install_go

- name: Install Go from upstream tarball
  when:
    - install_go
    - current_go_version.rc != 0 or go_version not in current_go_version.stdout
  block:
    - name: Download Go tarball
      ansible.builtin.get_url:
        url: "{{ go_tarball_url }}"
        dest: "/tmp/go{{ go_version }}.linux-amd64.tar.gz"
        mode: "0644"

    - name: Remove existing Go installation
      ansible.builtin.file:
        path: "{{ go_install_dir }}/go"
        state: absent

    - name: Extract Go tarball
      ansible.builtin.unarchive:
        src: "/tmp/go{{ go_version }}.linux-amd64.tar.gz"
        dest: "{{ go_install_dir }}"
        remote_src: true

- name: Add Go to system PATH
  ansible.builtin.copy:
    dest: /etc/profile.d/go.sh
    content: |
      export PATH=$PATH:{{ go_install_dir }}/go/bin
      export GOPATH=$HOME/go
    mode: "0644"

- name: Create symlink for Go binary
  ansible.builtin.file:
    src: "{{ go_install_dir }}/go/bin/go"
    dest: /usr/local/bin/go
    state: link
