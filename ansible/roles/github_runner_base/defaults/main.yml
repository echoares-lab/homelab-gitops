---
go_version: "1.22.4"
go_install_dir: /usr/local
go_tarball_url: "https://go.dev/dl/go{{ go_version }}.linux-amd64.tar.gz"

node_major_version: "20"

runner_base_packages:
  - git
  - curl
  - tar
  - unzip
  - zstd
  - ca-certificates
  - bash
  - coreutils
  - findutils
  - sed
  - gawk
  - build-essential
  - python3
  - python3-pip
  - jq
  - make

playwright_packages:
  - libnss3
  - libnspr4
  - libatk1.0-0t64
  - libatk-bridge2.0-0t64
  - libcups2t64
  - libdrm2
  - libdbus-1-3
  - libxkbcommon0
  - libxcomposite1
  - libxdamage1
  - libxfixes3
  - libxrandr2
  - libgbm1
  - libasound2t64
  - chromium-browser

install_playwright_deps: true
install_go: true
install_node: true
